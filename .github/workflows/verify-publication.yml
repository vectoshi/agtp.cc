name: Verify publication
on:
  pull_request:
  push:
    branches: [main]
jobs:
  context-and-proof-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python3 -m venv .test-venv
      - run: .test-venv/bin/pip install -r tests/requirements.txt
      - run: npm test
      - run: python3 src/build.py --snapshot 2026/ED-agtp-2.1-20261117-editorial1
      - run: git diff --exit-code
